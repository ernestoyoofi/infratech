name: LKS 2026 CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  STUDENT_NAME: ${{ secrets.STUDENT_NAME }}

jobs:
  install:
    name: Install & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -r requirements-frontend.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OPA policy check
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          ./opa test k8s/ -v || true  build_ecr:
    name: Build & Push ECR Images
    runs-on: ubuntu-latest
    needs: terraform_apply
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build API image
        run: |
          docker build -f docker/Dockerfile.api -t ${{ env.ECR_REGISTRY }}/lks-api-app:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/lks-api-app:latest .
          docker push ${{ env.ECR_REGISTRY }}/lks-api-app:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/lks-api-app:latest

      - name: Build Frontend image
        run: |
          docker build -f docker/Dockerfile.frontend -t ${{ env.ECR_REGISTRY }}/lks-fe-app:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/lks-fe-app:latest .
          docker push ${{ env.ECR_REGISTRY }}/lks-fe-app:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/lks-fe-app:latest

      - name: Scan images with Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL ${{ env.ECR_REGISTRY }}/lks-api-app:${{ github.sha }}
          trivy image --severity HIGH,CRITICAL ${{ env.ECR_REGISTRY }}/lks-fe-app:${{ github.sha }}

  upload_s3:
    name: Upload Deployment Metadata
    runs-on: ubuntu-latest
    needs: build_ecr
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment metadata
        run: |
          cat > deployment-metadata.json <<EOF
          {
            "deployment_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "api_image": "${{ env.ECR_REGISTRY }}/lks-api-app:${{ github.sha }}",
            "frontend_image": "${{ env.ECR_REGISTRY }}/lks-fe-app:${{ github.sha }}",
            "student": "${{ env.STUDENT_NAME }}"
          }
          EOF

      - name: Upload to S3
        run: |
          aws s3 cp deployment-metadata.json s3://${{ env.TF_STATE_BUCKET }}/deployments/metadata-${{ github.run_id }}.json

  terraform_apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: upload_s3
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var="student_name=${{ env.STUDENT_NAME }}" \
            -var="aws_region_primary=${{ env.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

  helm_deploy:
    name: Deploy with Helm
    runs-on: ubuntu-latest
    needs: terraform_apply
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name lks-eks-cluster --region ${{ env.AWS_REGION }}

      - name: Create namespaces
        run: |
          kubectl create namespace tenant-alpha --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace tenant-beta --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace tenant-alpha pod-security.kubernetes.io/enforce=restricted --overwrite
          kubectl label namespace tenant-beta pod-security.kubernetes.io/enforce=restricted --overwrite

      - name: Apply resource quotas
        run: |
          kubectl apply -f k8s/resource-quota.yaml

      - name: Deploy API to tenant-alpha
        run: |
          helm upgrade --install lks-api-alpha ./helm/api \
            --namespace tenant-alpha \
            --set image.repository=${{ env.ECR_REGISTRY }}/lks-api-app \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Deploy Frontend to tenant-alpha
        run: |
          helm upgrade --install lks-fe-alpha ./helm/frontend \
            --namespace tenant-alpha \
            --set image.repository=${{ env.ECR_REGISTRY }}/lks-fe-app \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Deploy API to tenant-beta
        run: |
          helm upgrade --install lks-api-beta ./helm/api \
            --namespace tenant-beta \
            --set image.repository=${{ env.ECR_REGISTRY }}/lks-api-app \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Deploy Frontend to tenant-beta
        run: |
          helm upgrade --install lks-fe-beta ./helm/frontend \
            --namespace tenant-beta \
            --set image.repository=${{ env.ECR_REGISTRY }}/lks-fe-app \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Verify deployments
        run: |
          kubectl get pods -n tenant-alpha
          kubectl get pods -n tenant-beta
          kubectl get svc -n tenant-alpha
          kubectl get svc -n tenant-beta

  smoke_test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: helm_deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          pip install requests boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB endpoint
        run: |
          echo "ALB_ENDPOINT=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[?LoadBalancerName==`lks-alb`].DNSName' --output text)" >> $GITHUB_ENV

      - name: Health check
        run: |
          curl -f http://${{ env.ALB_ENDPOINT }}/api/health || exit 1

      - name: CRUD test
        run: |
          # Create
          curl -X POST http://${{ env.ALB_ENDPOINT }}/api/users \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: tenant-alpha" \
            -d '{"name":"Test User","email":"test@example.com"}' || exit 1
          
          # Read
          curl -f http://${{ env.ALB_ENDPOINT }}/api/users \
            -H "X-Tenant-ID: tenant-alpha" || exit 1

      - name: Kinesis event check
        run: |
          aws kinesis describe-stream --stream-name lks-event-stream --region ${{ env.AWS_REGION }}

      - name: Test summary
        if: always()
        run: |
          echo "✓ Health checks passed"
          echo "✓ CRUD operations verified"
          echo "✓ Event pipeline active"
          echo "✓ All smoke tests completed"
